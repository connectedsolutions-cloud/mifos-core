<button *ngIf="!menuItem" mat-icon-button type="button" (click)="toggleTheme()" class="m-l-15 m-r-5">
  <mat-icon>{{ darkModeOn ? 'wb_sunny' : 'nights_stay' }}</mat-icon>
</button>

<button *ngIf="menuItem" mat-menu-item type="button" (click)="toggleTheme()">
  <mat-icon>{{ darkModeOn ? 'wb_sunny' : 'nights_stay' }}</mat-icon>
  <span>{{ (darkModeOn ? 'labels.menus.Light theme' : 'labels.menus.Dark theme') | translate }}</span>
</button>
