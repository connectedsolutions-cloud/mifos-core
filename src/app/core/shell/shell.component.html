<!-- Application Shell -->
<mat-sidenav-container id="mifosx-shell-container" autosize>
  <!-- Sidenav -->
  <mat-sidenav
    #sidenav
    class="sidebar-panel"
    [ngClass]="{
      'sidebar-full': !sidenavCollapsed,
      'sidebar-compact': sidenavCollapsed
    }"
    [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false"
  >
    <mifosx-sidenav [sidenavCollapsed]="sidenavCollapsed"></mifosx-sidenav>
  </mat-sidenav>

  <!-- Content -->
  <mat-sidenav-content class="sidenav">
    <!-- Toolbar -->
    <mifosx-toolbar [sidenav]="sidenav" (collapse)="toggleCollapse($event)"></mifosx-toolbar>
    <!-- Active request indicator -->
    <mifosx-loader *ngIf="progressBarMode === 'indeterminate'" class="shell-loader" diameter="80"></mifosx-loader>

    <!-- Breadcrumb -->
    <mifosx-breadcrumb></mifosx-breadcrumb>
    <!-- Content -->
    <mifosx-content></mifosx-content>
    <!-- Footer -->
    <mifosx-footer [styleClass]="'main-page'"></mifosx-footer>
  </mat-sidenav-content>
</mat-sidenav-container>
