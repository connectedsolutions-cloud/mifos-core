<h2 mat-dialog-title>Create Committee Session</h2>
<mat-dialog-content>
  <form [formGroup]="createForm">
    <mat-form-field>
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" required />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Participants</mat-label>
      <mat-select formControlName="integrantes" multiple required>
        <mat-option *ngFor="let user of users" [value]="user.id">
          {{ user.displayName }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions class="layout-row layout-xs-column layout-align-center gap-2percent" align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="create()" [disabled]="!createForm.valid">Create</button>
</mat-dialog-actions>
