<div class="visual-report-shell">
  <div class="visual-report-toolbar">
    <div>
      <strong>{{ dataObject?.report?.name }}</strong>
      <span>{{ 'labels.buttons.Preview' | translate }}</span>
    </div>
    <button mat-stroked-button type="button" (click)="load()" [disabled]="loading">
      {{ 'labels.buttons.Refresh' | translate }}
    </button>
    <button mat-stroked-button type="button" (click)="downloadCsv()" [disabled]="!result || loading">
      Descargar CSV
    </button>
    <button mat-stroked-button type="button" (click)="downloadPdf()" [disabled]="!result || loading || pdfGenerating">
      Descargar PDF
    </button>
    <button mat-raised-button color="primary" type="button" (click)="print()" [disabled]="!result || loading">
      {{ 'labels.buttons.Print' | translate }}
    </button>
  </div>

  <div class="visual-report-message" *ngIf="loading">{{ 'labels.buttons.Loading' | translate }}</div>
  <div class="visual-report-message visual-report-error" *ngIf="error">{{ error }}</div>

  <div class="visual-report-canvas" #reportCanvas *ngIf="result && !loading">
    <mifosx-comprobante-contable-report
      *ngIf="rendererKey === 'VisualVoucher'"
      [result]="result"
      [generatedBy]="reportOperator"
    ></mifosx-comprobante-contable-report>
    <mifosx-comprobante-contable-por-sucursal-report
      *ngIf="rendererKey === 'VisualBranchVoucher'"
      [result]="result"
      [generatedBy]="reportOperator"
    ></mifosx-comprobante-contable-por-sucursal-report>
    <mifosx-balance-saldos-detallado-report
      *ngIf="rendererKey === 'VisualDetailBalance'"
      [result]="result"
      [generatedBy]="reportOperator"
    ></mifosx-balance-saldos-detallado-report>
    <mifosx-balance-saldos-report
      *ngIf="rendererKey === 'VisualBalanceSaldos'"
      [result]="result"
      [generatedBy]="reportOperator"
    ></mifosx-balance-saldos-report>
    <mifosx-estado-resultados-consolidado-report
      *ngIf="rendererKey === 'VisualIncomeStmt'"
      [result]="result"
      [generatedBy]="reportOperator"
    ></mifosx-estado-resultados-consolidado-report>
    <mifosx-informe-auxiliar-mayor-report
      *ngIf="rendererKey === 'VisualAuxLedger'"
      [result]="result"
      [generatedBy]="reportOperator"
    ></mifosx-informe-auxiliar-mayor-report>
    <mifosx-balance-comprobacion-report
      *ngIf="rendererKey === 'VisualTrialBalance'"
      [result]="result"
      [cutoff]="trialBalanceCutoff"
    ></mifosx-balance-comprobacion-report>
    <mifosx-concentracion-movimientos-report
      *ngIf="rendererKey === 'VisualDailyMovement'"
      [result]="result"
      [generatedBy]="reportOperator"
    ></mifosx-concentracion-movimientos-report>
    <mifosx-loan-arrears-report
      *ngIf="rendererKey === 'VisualLoanArrears'"
      [result]="result"
      [generatedBy]="reportOperator"
    ></mifosx-loan-arrears-report>
    <mifosx-movimientos-partidas-report
      *ngIf="rendererKey === 'VisualPartidaMoves'"
      [result]="result"
      [generatedBy]="reportOperator"
      [selectedFrom]="dataObject?.formData?.R_startDate ?? ''"
      [selectedTo]="dataObject?.formData?.R_endDate ?? ''"
    ></mifosx-movimientos-partidas-report>
  </div>
</div>
