<div class="container">
  <button mat-button (click)="back()">{{ 'labels.buttons.Back' | translate }}</button>
  <div *ngIf="loading">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
  <div *ngIf="error" class="error-message">{{ error }}</div>
  <div *ngIf="!loading && flow">
    <h2>{{ flow.name }}</h2>
    <p>{{ flow.description }}</p>
    <p>
      <strong>{{ 'labels.text.Status' | translate }}:</strong> {{ flow.status }}
    </p>
    <h3>{{ 'labels.text.Steps' | translate }}</h3>
    <mat-card *ngFor="let step of flow.steps" class="step-card">
      <mat-card-header>
        <mat-card-title>{{ step.name }}</mat-card-title>
        <mat-card-subtitle
          >{{ step.status }} - {{ 'labels.text.Responsable' | translate }}:
          {{ step.responsableUserName }}</mat-card-subtitle
        >
      </mat-card-header>
      <mat-card-content *ngIf="step.description">
        <p>{{ step.description }}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-raised-button color="primary" *ngIf="canComplete(step)" (click)="completeStep(step)">
          {{ 'labels.buttons.Complete' | translate }}
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
