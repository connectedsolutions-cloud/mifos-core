<h2 mat-dialog-title>{{ 'labels.text.Create New Flow' | translate }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="submit()" id="create-flow-form">
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>{{ 'labels.text.Blueprint' | translate }}</mat-label>
      <mat-select formControlName="blueprintId" required>
        <mat-option *ngFor="let b of blueprints" [value]="b.id">{{ b.name }}</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>{{ 'labels.inputs.Name' | translate }}</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>{{ 'labels.inputs.Description' | translate }}</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>
    <p *ngIf="error" class="error-message">{{ error }}</p>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()" [disabled]="loading">
    {{ 'labels.buttons.Cancel' | translate }}
  </button>
  <button mat-raised-button color="primary" type="submit" form="create-flow-form" [disabled]="loading">
    {{ 'labels.buttons.Create' | translate }}
  </button>
</mat-dialog-actions>
