<div class="container">
  <mat-card>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="layout-row-wrap gap-2percent">
          <mat-form-field class="flex-50">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" required />
          </mat-form-field>
          <mat-form-field class="flex-50">
            <mat-label>DTE amount type (optional)</mat-label>
            <mat-select formControlName="dteAmountType">
              <mat-option [value]="''">—</mat-option>
              <mat-option *ngFor="let t of dteTypes" [value]="t">{{ t }}</mat-option>
            </mat-select>
          </mat-form-field>
          <mat-form-field class="flex-50">
            <mat-label>Charge (mutually exclusive with loan component)</mat-label>
            <mat-select formControlName="chargeId">
              <mat-option [value]="null">—</mat-option>
              <mat-option *ngFor="let c of charges" [value]="c.id">{{ c.name }} ({{ c.id }})</mat-option>
            </mat-select>
          </mat-form-field>
          <mat-form-field class="flex-50">
            <mat-label>Loan component</mat-label>
            <mat-select formControlName="loanComponent">
              <mat-option value="">—</mat-option>
              <mat-option *ngFor="let lc of loanComponents" [value]="lc">{{ lc }}</mat-option>
            </mat-select>
          </mat-form-field>
          <mat-form-field class="flex-100">
            <mat-label>Client type (optional; blank = default for all)</mat-label>
            <input matInput formControlName="clientType" />
            <mat-hint>Exact match at invoice time; leave empty for default rule.</mat-hint>
          </mat-form-field>
        </div>
        <div class="layout-row gap-10px m-t-20">
          <button mat-raised-button color="primary" type="submit" [disabled]="form.get('name')?.invalid">Submit</button>
          <button mat-button type="button" [routerLink]="['..']">Cancel</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
