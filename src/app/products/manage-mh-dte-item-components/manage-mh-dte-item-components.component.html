<div class="container m-b-20 layout-row align-end gap-20px">
  <button
    mat-raised-button
    color="primary"
    [routerLink]="['create']"
    *mifosxHasPermission="'CREATE_MH_DTE_ITEM_COMPONENT'"
  >
    <fa-icon icon="plus" class="m-r-10"></fa-icon>
    Create mapping
  </button>
</div>

<div class="container">
  <div class="layout-row">
    <mat-form-field class="flex-fill">
      <mat-label>Filter</mat-label>
      <input matInput (keyup)="applyFilter($any($event.target).value)" />
    </mat-form-field>
  </div>

  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>
      <ng-container matColumnDef="dteAmountType">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>DTE amount type</th>
        <td mat-cell *matCellDef="let row">{{ row.dteAmountType || '—' }}</td>
      </ng-container>
      <ng-container matColumnDef="target">
        <th mat-header-cell *matHeaderCellDef>Target</th>
        <td mat-cell *matCellDef="let row">{{ targetLabel(row) }}</td>
      </ng-container>
      <ng-container matColumnDef="clientType">
        <th mat-header-cell *matHeaderCellDef>Client type</th>
        <td mat-cell *matCellDef="let row">{{ row.clientType || '(default)' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns" [routerLink]="[row.id]" class="select-row"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons></mat-paginator>
  </div>
</div>
