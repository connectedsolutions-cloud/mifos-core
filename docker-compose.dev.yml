version: '3.8'

services:
  mifosx-web-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mifosx-dev
    ports:
      - '4200:4200'
    volumes:
      # Mount source code for hot reload
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.angular
    environment:
      - FINERACT_API_URLS=${FINERACT_API_URLS:-https://sandbox.mifos.community,https://demo.mifos.community,https://localhost:8443}
      - FINERACT_API_URL=${FINERACT_API_URL:-https://localhost:8443}
      - FINERACT_API_PROVIDER=${FINERACT_API_PROVIDER:-/fineract-provider/api}
      - FINERACT_API_VERSION=${FINERACT_API_VERSION:-/v1}
      - FINERACT_PLATFORM_TENANT_IDENTIFIER=${FINERACT_PLATFORM_TENANT_IDENTIFIER:-default}
      - MIFOS_DEFAULT_LANGUAGE=${MIFOS_DEFAULT_LANGUAGE:-en-US}
      - MIFOS_SUPPORTED_LANGUAGES=${MIFOS_SUPPORTED_LANGUAGES:-cs-CS,de-DE,en-US,es-MX,es-CL,fr-FR,it-IT,ko-KO,lt-LT,lv-LV,ne-NE,pt-PT,sw-SW}
      - MIFOS_SESSION_IDLE_TIMEOUT=${MIFOS_SESSION_IDLE_TIMEOUT:-300000}
      - MIFOS_PRELOAD_CLIENTS=${MIFOS_PRELOAD_CLIENTS:-true}
      - MIFOS_DEFAULT_CHAR_DELIMITER=${MIFOS_DEFAULT_CHAR_DELIMITER:-,}
      - MIFOS_OAUTH_SERVER_ENABLED=${MIFOS_OAUTH_SERVER_ENABLED:-false}
      - MIFOS_OAUTH_SERVER_URL=${MIFOS_OAUTH_SERVER_URL:-}
      - MIFOS_OAUTH_CLIENT_ID=${MIFOS_OAUTH_CLIENT_ID:-web-app}
      - MIFOS_HTTP_CACHE_ENABLED=${MIFOS_HTTP_CACHE_ENABLED:-true}
      - NODE_ENV=development
    command: npm run start
    stdin_open: true
    tty: true
    networks:
      - mifos-fineract-dev

networks:
  mifos-fineract-dev:
    name: mifos-fineract-dev
    driver: bridge
